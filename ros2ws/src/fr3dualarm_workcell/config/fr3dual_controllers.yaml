# This is copied from franka_ros2 implementation of this arm controller with some redundancies removed and left/right separate

controller_manager:
  ros__parameters:
    left_fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**:
  left_fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - left_fr3_joint1
        - left_fr3_joint2
        - left_fr3_joint3
        - left_fr3_joint4
        - left_fr3_joint5
        - left_fr3_joint6
        - left_fr3_joint7
      gains:
        left_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        left_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        left_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        left_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        left_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        left_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        left_fr3_joint7: { p: 75., d: 10., i: 0., i_clamp: 1. }  # joint 7 control has issues in simulation
  right_fr3_arm_controller:
    ros__parameters:
      command_interfaces:
        - effort
      state_interfaces:
        - position
        - velocity
      joints:
        - right_fr3_joint1
        - right_fr3_joint2
        - right_fr3_joint3
        - right_fr3_joint4
        - right_fr3_joint5
        - right_fr3_joint6
        - right_fr3_joint7
      gains:
        right_fr3_joint1: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint2: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint3: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint4: { p: 600., d: 30., i: 0., i_clamp: 1. }
        right_fr3_joint5: { p: 250., d: 10., i: 0., i_clamp: 1. }
        right_fr3_joint6: { p: 150., d: 10., i: 0., i_clamp: 1. }
        right_fr3_joint7: { p: 75., d: 10., i: 0., i_clamp: 1. }  # joint 7 control has issues in simulation
