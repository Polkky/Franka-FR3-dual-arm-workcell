#   - Ubuntu 24.04
#   - ROS2 Jazzy

services:
  ros2cont:
    tty: true 
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: FRDualArm
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ros2ws/src:/ros2ws/src
    environment:
      - DISPLAY=$DISPLAY
volumes: 
  ros2cont: